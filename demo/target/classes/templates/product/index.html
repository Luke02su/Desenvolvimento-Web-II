<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <table class="table table-striped">
            <h2>Listagem de produtos</h2>
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Estoque</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${productsList}"> <!--th:eah realiza o laço de repetição na lista de produtos-->
                    <td scope="row" th:text="${product.name}"></td> <!--th:text injeta valores da model no html-->
                    <td scope="row th:text="${product.description}"></td>
                    <td scope="row th:text="${product.price}"></td>
                    <td scope="row th:text="${product.stock}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

<!--Integração automática com o Spring MVC pelo uso de Model-->
