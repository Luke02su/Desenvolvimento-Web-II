<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <th:block th:replace="~{/../fragments/head :: head('Cadastrar Produto')}"></th:block>
    <body>
        <th:block th:replace="~{/../fragments/head :: header}"></th:block>
        <div class="container">
        <h1>Cadastrar Fii</h1>
        <form action="#" th:action="@{/fii/save}" th:object="${fii}" method="POST">
            <!-- Campo necessário para que o save saiba que não estamos criando, mas editando um produto -->
            <input type="hidden" th:field="*{id}" />

            <div class="form-group row">
                <label for="ticket" class="col-sm-2 col-form-label">Ticket:</label>
                <div class="col-sm-10">
                    <input type="text" ith:field="*{ticket}" th:field="*{ticket}" id="ticket" class="form-control" name="ticket" placeholder="Digite o ticket do fundo imobiliário">
                    <p th:if="${#fields.hasErrors('ticket')}" th:errorclass="text-danger" th:errors="*{ticket}" />
                </div>
            </div>
            <div class="form-group row">
                <label for="gestora" class="col-sm-2 col-form-label">Gestora</label>
                <div class="col-sm-10">
                    <input type="text" th:field="*{gestora}" class="form-control" id="gestora" name="gestora" placeholder="Digite a gestora do fundo imobiliário">
                    <p th:if="${#fields.hasErrors('gestora')}" th:errorclass="text-danger" th:errors="*{gestora}" />
                </div>
            </div>
            <div class="form-group row">
                <label for="segmento" class="col-sm-2 col-form-label">Segmento</label>
                <div class="col-sm-10">
                    <input type="text" th:field="*{segmento}" class="form-control" id="segmento" name="segmento" placeholder="Digite o segmento do fundo imobiliário">
                    <p th:if="${#fields.hasErrors('segmento')}" th:errorclass="text-danger" th:errors="*{segmento}" />
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label" for="cotacao">Cotação:</label>
                <div class="col-sm-10">
                    <input type="number" th:field="*{cotacao}" class="form-control" id="cotacao" name="cotacao" step="0.01" placeholder="Digite a cotação do fundo imobiliário" >
                    <p th:if="${#fields.hasErrors('cotacao')}" th:errorclass="text-danger" th:errors="*{cotacao}" />
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label" for="pvp">P/VP:</label>
                <div class="col-sm-10">
                    <input type="number" th:field="*{pvp}" class="form-control" id="pvp" name="pvp" step="0.01" placeholder="Digite o P/VP do fundo imobiliário" >
                    <p th:if="${#fields.hasErrors('pvp')}" th:errorclass="text-danger" th:errors="*{pvp}" />
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label" for="dy">DY:</label>
                <div class="col-sm-10">
                    <input type="number" th:field="*{dy}" class="form-control" id="dy" name="dy" step="0.01" placeholder="Digite o DY do fundo imobiliário" >
                    <p th:if="${#fields.hasErrors('dy')}" th:errorclass="text-danger" th:errors="*{dy}" />
                </div>
            </div>
            <button type="submit" class="btn btn-primary"> Cadastrar Fii</button>
        </form>
    </div>
    <th:block th:replace="~{/../fragments/footer :: footer}"></th:block>
</body>
</html>
