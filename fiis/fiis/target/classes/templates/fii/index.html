<!DOCTYPE html>
<html lang="pt-br">
    <th:block th:replace="~{/../fragments/head :: head('Listar Fii')}"></th:block>
    <body>
    <th:block th:replace="~{/../fragments/head :: header}"></th:block>
    <div class="container">
        <table class="table table-striped">
            <h2>Listagem de Fiis</h2>
            <thead>
                <tr>
                    <th scope="col">Ticket</th>
                    <th scope="col">Gestora</th>
                    <th scope="col">Segmento</th>
                    <th scope="col">Cotação</th>
                    <th scope="col">P/VP</th>
                    <th scope="col">DY</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fii : ${fiisList}"> <!--th:eah realiza o laço de repetição na lista de produtos-->
                    <td scope="row" th:text="${fii.ticket}"></td> <!--th:text injeta valores da model no html-->
                    <td scope="row" th:text="${fii.gestora}"></td>
                    <td scope="row" th:text="${fii.segmento}"></td>
                    <td scope="row" th:text="${fii.cotacao}"></td>
                    <td scope="row" th:text="${fii.pvp}"></td>
                    <td scope="row" th:text="${fii.dy}"></td>
                    <td><a th:href="@{/fii/edit/{id}(id=${fii.id})}">Editar</a></td>
                    <td><a th:href="@{/fii/delete/{id}(id=${fii.id})}">Deletar</a></td>
                </tr>
            </tbody>
        </table>
        <div class="row">
            <a th:href="@{/fii/create}">
                <button sec:authorize="hasAuthority('Admin')" class="btn btn-primary">Cadastrar Fii</button>
            </a>
        </div>
    </div>
    <th:block th:replace="~{/../fragments/footer :: footer}"></th:block>
</body>
</html>

<!--Integração automática com o Spring MVC pelo uso de Model-->
