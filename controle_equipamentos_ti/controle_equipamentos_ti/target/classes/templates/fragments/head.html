<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Fragmento HEAD -->
<th:block th:fragment="head(title)">
  <head>
    <title th:text="${title}">Título padrão</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
            integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
            integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
            crossorigin="anonymous"></script>
  </head>
</th:block>

<!-- Fragmento HEADER (Navbar) -->
<th:block th:fragment="header()">
  <nav class="navbar navbar-expand-lg navbar-green bg-success fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand text-white" style="font-weight: bold;">
        Controle de Equipamentos de TI da RFN
      </a>
      
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mr-auto">

          <li class="nav-item active">
            <a class="nav-link" th:href="@{/}">Instruções</a>
          </li>

          <!-- Dropdown Equipamentos -->
          <li class="nav-item dropdown active">
            <a class="nav-link dropdown-toggle" href="#" id="equipamentosDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Equipamentos
            </a>
            <div class="dropdown-menu" aria-labelledby="equipamentosDropdown">
              <a class="dropdown-item" th:href="@{/computador}">Computadores</a>
              <a class="dropdown-item" th:href="@{/impressoraNaoFiscal}">Impressoras não fiscais</a>
              <a class="dropdown-item" sec:authorize="hasAuthority('Admin')" th:href="@{/generico}">Genéricos</a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" th:href="@{/descarte}">Descartes</a>
            </div>
          </li>

          <!-- Dropdown Envios -->
          <li class="nav-item dropdown active">
            <a class="nav-link dropdown-toggle" href="#" id="enviosDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Envios
            </a>
            <div class="dropdown-menu" aria-labelledby="enviosDropdown">
              <a class="dropdown-item" th:href="@{/envioAtual}">Envios atuais</a>
              <a class="dropdown-item" th:href="@{/envioAntigo}">Envios antigos</a>
            </div>
          </li>

          <!-- Links Simples -->
          <li class="nav-item active">
            <a class="nav-link" th:href="@{/loja}">Loja</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" th:href="@{/dashboardBI}">Dashboard BI</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</th:block>
</html>
