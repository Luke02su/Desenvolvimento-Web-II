<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/../fragments/head :: head('Lista de genéricos')}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div th:replace="~{/../fragments/head :: header}"></div>
<br>
<br>
<br>
    <div class="container-fluid ps-3 pe-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/generico/create}" class="btn btn-success">
                ➕ Cadastrar novo
            </a>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="filtroInput" class="form-control" placeholder="🔍 Filtrar qualquer coluna...">
        </div>
          
          <script>
            document.getElementById("filtroInput").addEventListener("input", function () {
              const filtro = this.value.toLowerCase();
              const linhas = document.querySelectorAll("#tabelaGenericos tbody tr");
            
              linhas.forEach(linha => {
                const textoLinha = linha.innerText.toLowerCase();
                linha.style.display = textoLinha.includes(filtro) ? "" : "none";
              });
            });
            </script>
     
        <div class="custom-table-wrapper table-responsive table-sm">
            <table id="tabelaGenericos" class="table table-hover table-bordered align-middle text-center">
                <thead class=>
                    <tr>
                        <th>Nº série</th>
                        <th>Placa</th>
                        <th>Tipo</th>
                        <th>Modelo</th>
                        <th>Descrição</th>
                        <th>Localização atual</th>
                        <th>Enviado</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="generico : ${genericoList}">
                        <td th:text="${generico.equipamento.pk_num_serie}"></td>
                        <td th:text="${generico.equipamento.placa}"></td>
                        <td th:text="${generico.equipamento.tipo}"></td>
                        <td th:text="${generico.equipamento.modelo}"></td>
                        <td th:text="${generico.descricao}"></td>
                        <td th:text="${generico.equipamento.localizacao_atual}"></td>
                        <td th:text="${generico.equipamento.enviado}"></td>
                        <td>
                            <div class="btn-group" role="group">
                                <a th:href="@{/generico/edit/{id}(id=${generico.pk_equipamento_generico})}"
                                   class="btn btn-sm btn-warning">✏️ Editar</a>
                                <a th:href="@{/generico/delete/{id}(id=${generico.pk_equipamento_generico})}"
                                   class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja deletar o equipamento genérico?')">🗑️ Deletar</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <hr>
    <div th:replace="~{/../fragments/footer :: footer}"></div>
</body>
</html>
